<p>Справочник предназначен для учета архивных документов.</p>
<p>Каждая <a href="Catalog.aps_ИнвентарныеКниги/Help">карточка учета</a> содержит список документов и их ревизий. Для правильного учета инвентарных номеров используется поле "Изменение", которое придает уникальность ревизии в рамках общего инвентарного номера.</p></body></html>
