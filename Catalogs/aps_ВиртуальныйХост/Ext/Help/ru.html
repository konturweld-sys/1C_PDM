<p style="MARGIN: 0cm 0cm 0pt" class="MsoNormal">Системный справочник, хранящий структуру файлов и папок для построения веб-интерфейса системы. Сюда относятся шаблоны <span style="mso-ansi-language: EN-US" lang="EN-US">html</span>-страниц, сценарии <span style="mso-ansi-language: EN-US" lang="EN-US">javascript</span>, картинки, видео и пр. При первом запуске системе структура виртуального хоста выгружается на локальный диск.</p></body></html>
