<p>В справочнике перечислены типы аналогов. <em>Аналог</em> - объект, идентичный или соответствующий данному по каким-либо параметрам.</p>
<p>При описании электронной структуры изделия могут быть определены конструктивные аналоги. В технологии, например, могут указываться аналоги оборудования.</p></body></html>
