<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN"><html><head><meta content="text/html; charset=utf-8" http-equiv="Content-Type"></meta><link rel="stylesheet" type="text/css" href="v8help://service_book/service_style"></link><meta name="GENERATOR" content="MSHTML 8.00.6001.18813"></meta></head><body>Документ оформляется на основании заявки на тиражирование и отражает момент выдачи распечатанных копий выбранным абонентам. Выдачу по заявке можно оформить несколькими документами, скорректировав список выданной документации.</body></html>
