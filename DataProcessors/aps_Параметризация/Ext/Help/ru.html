<p>С помощью окна параметризации можно пронаследовать или скопировать параметры от одного элемента к другому. Окно, аналогично <a href="DataProcessor.aps_ИнформацияОбЭлементе/Help">информации об элементе</a>, меняет свое содержимое при выделении элемента в каком-либо другом окне. При наличии параметров связи у выделенного объекта, они также будут доступны.</p></body></html>
