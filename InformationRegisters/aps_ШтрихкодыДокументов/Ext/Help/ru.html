<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN"><html><head><meta content="text/html; charset=utf-8" http-equiv="Content-Type"></meta><link rel="stylesheet" type="text/css" href="v8help://service_book/service_style"></link><meta name="GENERATOR" content="MSHTML 8.00.6001.18813"></meta></head><body>Регистр предназначен для хранения штрихкодов элементов системы вида "документ". Штрихкод формируется автоматически типа EAN-13. Для печати штрихкодов на компьютере должен быть установлен элемент управления "1С:Печать штрихкодов" (1CBarCode.exe).</body></html>
